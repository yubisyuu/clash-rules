# =====================================================================
# Stash 分流规则
# 适配环境：Stash (iOS / macOS / tvOS / visionOS)
# 规则模型：洋葱过滤 → 广告拒止 → 服务精准分流（AI → 社媒 → 券商 → 钱包 → 加密 → 预测 → 开发 → 流媒体）→ 国内直连 → GFW/代理列表 → MATCH 兜底
# =====================================================================

# =====================================================================
# [全局基础] — 端口 / 模式 / IPv6（unified-delay / tcp-concurrent / find-process-mode 无 Stash 对应项）
# =====================================================================
port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false

profile:
  store-selected: true

# =====================================================================
# [DNS] — Fake-IP（解析器集合与 Clash 对齐；listen / cache-algorithm / fake-ip-range / respect-rules / nameserver-policy 无 Stash 对应项）
# =====================================================================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
    - 119.29.29.29
    - system
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
    - https://dns.alidns.com/dns-query
    - system
  skip-cert-verify: true
  fake-ip-filter:
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - 'lens.l.google.com'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'

# =====================================================================
# [Proxy Providers] — 机场订阅（单订阅，键名与 path 成对）
# =====================================================================
proxy-providers:
  cocoduck:
    type: http
    url: "https://sub.cocoduck.cc/sub/1cacb1b806ac5b83/clash#COCODUCK"
    path: ./cocoduck_provider.yaml
    interval: 36000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# =====================================================================
