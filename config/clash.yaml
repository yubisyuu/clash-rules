# =====================================================================
# Clash 分流
# 适配环境：Clash Verge / Clash Meta / OpenClash
# 规则模型：洋葱过滤 → 广告拒止 → 服务精准分流（AI → 社媒 → 券商 → 钱包 → 加密 → 预测 → 开发 → 流媒体）→ 国内直连 → GFW/代理列表 → MATCH 兜底
# =====================================================================

# =====================================================================
# [全局基础] — 端口 / 模式 / IPv6 / 进程匹配
# =====================================================================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# =====================================================================
# [Sniffer] — 域名嗅探
# =====================================================================
sniffer:
  enable: true
  force-domain-sniffing: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.mijia.xiaomi.com"
    - "+.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

# =====================================================================
# [TUN] — 入站隧道
# =====================================================================
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# =====================================================================
# [DNS] — Fake-IP
# =====================================================================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # mihomo 内置默认值，显式写出以锁定解析行为（此键为整体覆盖，新增域名须追加在本列表内）
  fake-ip-filter:
    - dns.msftnsci.com
    - www.msftnsci.com
    - www.msftconnecttest.com

  respect-rules: true

  # mihomo 内置默认值，显式写出以锁定解析行为
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29

# =====================================================================
# [Geodata 镜像] — 地理库改走 cdn.jsdelivr.net（mihomo 默认源在 github.com，国内常失败）
# =====================================================================
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

geo-auto-update: true
geo-update-interval: 24

# =====================================================================
# [Proxy Providers] — 机场订阅
# =====================================================================
proxy-providers:
  cocoduck:
    type: http
    url: "https://sub.cocoduck.cc/sub/1cacb1b806ac5b83/clash#COCODUCK"
    path: ./cocoduck_provider.yaml
    interval: 36000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

